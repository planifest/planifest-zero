# product.yml: product-level version manifest (ADR-002, feature 0000016).
#
# This project has one component. It keeps a product.yml anyway because
# telemetry hooks source product_id from the `id` field below, so events stay
# attributable to the same product regardless of clone location or machine
# (feature 0000024).
#
# components[] holds {id, path} pointers to each component's own
# component.yml, not a cached version. Versions are read live at derivation
# time by `node planifest-framework/scripts/product-version.mjs`, so this list
# only needs editing when a component is added or removed.

id: "planifest-framework"
name: "Planifest Framework"
version: "0.1.0"
feature: "0000030-framework-cut-down"

versionPolicy: "max-component-version"

components:
  - id: "planifest-framework"
    path: "planifest-framework/component.yml"
